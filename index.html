<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinmin Desktop — Purple Linux Mint in the Browser</title>
    <meta name="description" content="Cinmin Desktop is a free browser-based desktop environment — purple Linux Mint style. File Explorer, Terminal, Browser, Notepad, plugins, all in one tab. Like YukiOS, no install." />
    <meta name="theme-color" content="#4c1d95" />
    <meta property="og:title" content="Cinmin Desktop — Browser OS" />
    <meta property="og:description" content="A YukiOS-like browser desktop built in vanilla JS. No install, persistent, plugin ecosystem." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234c1d95'/><text x='50' y='62' text-anchor='middle' font-size='48' fill='white'>lm</text></svg>">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <div id="wallpaper">
        <!-- Mint LM logo center (like screenshot) -->
        <div id="wallpaper-logo" aria-hidden="true">
          <svg viewBox="0 0 100 100" width="220" height="220">
            <path d="M18 18 H58 C79 18 86 26 86 46 V76 C86 96 78 86 58 86 H28 C8 86 2 78 2 58 V28 C2 18 6 18 18 18 Z"
                  fill="none" stroke="#c084fc" stroke-width="8" stroke-linejoin="round" opacity="0.95"/>
            <path d="M28 38 V72 H36 V48 L44 72 H48 L56 48 V72 H64 V38 H56 L46 60 L36 38 Z"
                  fill="none" stroke="#c084fc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
          </svg>
        </div>
      </div>
      <div id="desktop"></div>
      <div id="windows"></div>

      <!-- Start menu — exact Mint replica -->
      <div id="start-menu" class="hidden">
        <div class="mint-search">
          <span class="mint-search-icon">⌕</span>
          <input id="start-search" type="text" placeholder="Search applications..." autocomplete="off" />
        </div>
        <div class="mint-body">
          <div class="mint-cats" id="mint-cats">
            <button class="mint-cat active" data-cat="all"><span class="cat-icon">⊞</span> All Applications</button>
            <button class="mint-cat" data-cat="accessories"><span class="cat-icon">👤</span> Accessories</button>
            <button class="mint-cat" data-cat="graphics"><span class="cat-icon">🎨</span> Graphics</button>
            <button class="mint-cat" data-cat="internet"><span class="cat-icon">🌐</span> Internet</button>
            <button class="mint-cat" data-cat="office"><span class="cat-icon">📄</span> Office</button>
            <button class="mint-cat" data-cat="media"><span class="cat-icon">▶</span> Sound & Video</button>
            <button class="mint-cat" data-cat="admin"><span class="cat-icon">⚙</span> Administration</button>
            <button class="mint-cat" data-cat="prefs"><span class="cat-icon">🛠</span> Preferences</button>
            <button class="mint-cat" data-cat="places"><span class="cat-icon">📁</span> Places</button>
            <button class="mint-cat" data-cat="recent"><span class="cat-icon">🕓</span> Recent Files</button>
          </div>
          <div class="mint-apps" id="mint-apps">
            <!-- filled by JS -->
          </div>
        </div>
        <div id="start-no-results" class="start-no-results hidden">No applications found</div>
      </div>

      <!-- Taskbar Mint -->
      <div id="taskbar">
        <button id="start-btn" class="start-btn" title="Menu">
          <span class="lm-icon">lm</span>
        </button>
        <button class="task-icon" data-app="explorer" title="Files">📁</button>
        <button class="task-icon" data-app="htmlviewer" title="Firefox">🦊</button>
        <button class="task-icon" data-app="terminal" title="Terminal">>_</button>
        <div id="taskbar-apps"></div>
        <div id="taskbar-right">
          <span class="tray-icon">📶</span>
          <span class="tray-icon">🔊</span>
          <span class="tray-icon">🔋</span>
          <span id="clock"></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
