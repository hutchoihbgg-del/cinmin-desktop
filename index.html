<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinmin Desktop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <!-- Wallpaper layer -->
      <div id="wallpaper"></div>

      <!-- Desktop icons layer -->
      <div id="desktop"></div>

      <!-- Windows layer -->
      <div id="windows"></div>

      <!-- Start menu -->
      <div id="start-menu" class="hidden">
        <div class="start-header">
          <div class="start-logo">◈ CINMIN</div>
          <div class="start-subtitle">Desktop Environment</div>
        </div>
        <div class="start-search-wrap">
          <input id="start-search" type="text" placeholder="Search apps..." autocomplete="off" />
        </div>
        <div class="start-apps" id="start-apps">
          <button class="start-item" data-app="explorer"><span>📁</span> File Explorer</button>
          <button class="start-item" data-app="terminal"><span>💻</span> Terminal</button>
          <button class="start-item" data-app="notepad"><span>📝</span> Notepad</button>
          <button class="start-item" data-app="htmlviewer"><span>🌐</span> Browser</button>
          <button class="start-item" data-app="settings"><span>⚙</span> Settings</button>
        </div>
        <div id="start-recent" class="start-recent hidden">
          <div class="start-recent-title">Recent</div>
          <div id="start-recent-list"></div>
        </div>
        <div id="start-no-results" class="start-no-results hidden">No apps found</div>
        <div class="start-footer">
          <div class="power-wrap">
            <button id="power-btn" class="start-shutdown">⏻ Power ▴</button>
            <div id="power-menu" class="power-menu hidden">
              <button data-power="shutdown">⏻ Shut Down</button>
              <button data-power="restart">↻ Restart</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Taskbar -->
      <div id="taskbar">
        <button id="start-btn" class="start-btn">◈ CINMIN</button>
        <div id="taskbar-apps"></div>
        <div id="taskbar-right">
          <span id="clock"></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
